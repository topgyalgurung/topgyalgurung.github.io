---
layout: default
---

<article class="section post">
  <div class="section-head">
    <h1>{{ page.title }}</h1>
    <span class="note">{{ page.date | date: "%B %d, %Y" }}</span>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="section-footnote">
    <a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a>
  </p>
</article>
